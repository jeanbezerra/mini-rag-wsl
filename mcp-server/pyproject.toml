[project]
name = "mini-rag-mcp"
version = "0.1.0"
description = "Gateway MCP local de leitura para o Mini RAG"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
mini-rag-mcp = "rag_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
