name: mini-rag

x-backend: &backend
  image: mini-rag-api:local
  build:
    context: ./backend
  init: true
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: mini-rag-postgres:18.6-vector0.8.7
    build:
      context: ./database
    restart: unless-stopped
    environment:
      POSTGRES_DB: mini_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute bash scripts/bootstrap.sh}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Execute bash scripts/bootstrap.sh}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Execute bash scripts/bootstrap.sh}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d mini_rag']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend
    command: [python, -m, rag.migrate]
    environment:
      DATABASE_URL: postgresql://rag_migrator:${MIGRATOR_DB_PASSWORD:?Execute bash scripts/bootstrap.sh}@db:5432/mini_rag
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  ollama:
    image: ollama/ollama:0.40.8
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '4'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_VULKAN: '0'
      CUDA_VISIBLE_DEVICES: '-1'
      ROCR_VISIBLE_DEVICES: '-1'
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  model-init:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [pull, '${OLLAMA_MODEL:-qwen3:1.7b-q4_K_M}']
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure:3
    security_opt:
      - no-new-privileges:true

  api:
    <<: *backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rag_app:${APP_DB_PASSWORD:?Execute bash scripts/bootstrap.sh}@db:5432/mini_rag
      DATA_DIR: /data
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b-q4_K_M}
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      CPU_THREADS: ${CPU_THREADS:-4}
      OMP_NUM_THREADS: ${CPU_THREADS:-4}
      TOKENIZERS_PARALLELISM: 'false'
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_DOCUMENTS: ${MAX_DOCUMENTS:-200}
      MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-2000}
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    volumes:
      - app_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=8)); assert h['database']['status']=='ok'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mcp:
    image: mini-rag-mcp:local
    build:
      context: ./mcp-server
    init: true
    restart: unless-stopped
    environment:
      MCP_API_BASE_URL: http://api:8000
      MCP_HOST: 0.0.0.0
      MCP_PORT: '8001'
      MCP_REQUEST_TIMEOUT_SECONDS: ${MCP_REQUEST_TIMEOUT_SECONDS:-180}
    ports:
      - '127.0.0.1:${MCP_PORT:-8001}:8001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz',timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: mini-rag-web:local
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  ollama_models:
  app_data:
